create_replay:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: recuperator
    hours:
      selector:
        number:
          min: 0.25
          max: 168
          step: 0.25
          unit_of_measurement: h
          mode: box
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    playback_seconds:
      selector:
        number:
          min: 5
          max: 900
          unit_of_measurement: s
          mode: box
    frames:
      selector:
        number:
          min: 0
          max: 1440
          mode: box
